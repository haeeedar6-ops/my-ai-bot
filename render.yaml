services:
  - type: web
    name: family-expense-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # يتم ضبط المفتاح في لوحة تحكم Render تحت Environment Variables
      - key: JWT_SECRET
        generateValue: true # يقوم Render بتوليد مفتاح عشوائي آمن تلقائياً
      - key: DEFAULT_AI_MODEL
        value: auto
      - key: NODE_ENV
        value: production