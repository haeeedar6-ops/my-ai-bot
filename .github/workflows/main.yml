name: Build RYN Agent (Android APK + Windows PC EXE)

on:
  push:
    paths:
      - "ryn-android/**"
      - "ryn-desktop/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: "📱 Build Android Phone APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        working-directory: ./ryn-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RYN-Agent-Phone-APK
          path: ryn-android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    name: "💻 Build Windows PC EXE"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & Build EXE
        working-directory: ./ryn-desktop
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name RYN-Agent-PC run_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: RYN-Agent-Windows-PC-EXE
          path: ryn-desktop/dist/RYN-Agent-PC.exe
